name: btc2g-audience-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: btc2g_audience_local
      POSTGRES_USER: btc2g_local
      POSTGRES_PASSWORD: btc2g_local_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btc2g_local -d btc2g_audience_local"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - audience_postgres_data:/var/lib/postgresql/data

volumes:
  audience_postgres_data:
