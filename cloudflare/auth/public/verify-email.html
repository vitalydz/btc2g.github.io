<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Verify email · BTC2G</title>
  <link rel="stylesheet" href="/account.css">
</head>
<body>
  <main class="shell">
    <a class="brand" href="/" aria-label="Back to BTC2G account">₿<span>BTC2G</span></a>
    <section class="hero">
      <p class="eyebrow">ACCOUNT EMAIL</p>
      <h1>Verify your email</h1>
      <p>Confirm the address for the BTC2G account that is currently signed in.</p>
    </section>
    <section class="card">
      <button class="primary" id="confirm-email" type="button">Confirm email</button>
      <p class="message" id="verify-message" role="status" aria-live="polite"></p>
      <p><a href="/">Return to account</a></p>
    </section>
    <p class="disclaimer">Email verification does not subscribe you to marketing or activate Premium.</p>
  </main>
  <script type="module" src="/verify-email.js"></script>
</body>
</html>
