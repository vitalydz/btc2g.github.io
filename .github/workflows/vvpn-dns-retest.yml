name: VVPN Russian DNS retest

# Vladivostok is deliberately deferred until Moscow browser testing is complete.
# This diagnostics workflow remains available for a manual later-stage rerun.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns-retest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retest six DNS failures from Vladivostok using two resolvers
        env:
          PYTHONPATH: tools/vvpn
        run: python .github/scripts/vvpn_dns_retest.py
      - name: Show raw result report
        if: always()
        run: |
          if [ -f vvpn-dns-retest/report.json ]; then
            cat vvpn-dns-retest/report.json
            cat vvpn-dns-retest/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vvpn-vladivostok-dns-retest
          path: vvpn-dns-retest/
          if-no-files-found: warn
          retention-days: 14
