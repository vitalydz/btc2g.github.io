name: Audience API tests
on:
  pull_request:
    paths:
      - 'services/audience/**'
      - '.github/workflows/audience-test.yml'
      - 'assets/js/digest-preferences.js'
      - 'assets/audience-config.json'
      - 'index.html'
      - 'tests/digest-preferences.test.cjs'
      - 'tests/subscription-receipt.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audience_test
          POSTGRES_PASSWORD: ephemeral_test_only
          POSTGRES_DB: audience_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audience_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/audience
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/audience/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://audience_test:ephemeral_test_only@localhost:5432/audience_test
      - run: node --test ../../tests/digest-preferences.test.cjs ../../tests/subscription-receipt.test.cjs
