name: Update BTC vs Gold Chart

on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:

concurrency:
  group: btc-gold-market-update
  cancel-in-progress: false

jobs:
  update-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate chart
        run: |
          for attempt in 1 2 3; do
            if python scripts/update_btc_gold_chart.py && python scripts/update_multi_asset.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          exit 1

      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/btc_gold_forecast.png assets/btc_gold_forecast_meta.json assets/btc_signal.json assets/btc_gold_history.json assets/multi_asset_strength.json
          if git diff --staged --quiet; then
            echo "No chart changes to commit."
          else
            git commit -m "Update BTC vs Gold forecast chart"
            git pull --rebase origin main
            git push
          fi
