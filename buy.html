<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071426" />
  <title>Buy BTC</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to bottom right, #f1f4f9, #dff1ff);
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }
    .container {
      position: relative;
      max-width: 480px;
      margin: auto;
      background: white;
      border-radius: 12px;
      padding: 72px 30px 30px;
      box-shadow: 0 0 25px rgba(0,0,0,0.1);
    }
    h1 {
      margin-bottom: 16px;
      color: #333;
      font-size: 2em;
    }
    .language-control {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      justify-content: flex-end;
    }
    .language-control select {
      min-height: 32px;
      min-width: 132px;
      box-sizing: border-box;
      padding: 4px 30px 4px 10px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      background: #e0e0e0;
      cursor: pointer;
      font-weight: bold;
      font: inherit;
    }
    .language-control select:hover {
      background: #ccc;
    }
    .buy-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      min-height: 48px;
      box-sizing: border-box;
      margin: 8px 0;
      padding: 12px 22px;
      font-weight: bold;
      font-size: 0.98em;
      line-height: 1.2;
      color: white;
      background-color: #3c67e3;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
      user-select: none;
    }
    .buy-button:hover {
      background-color: #2a4fcc;
    }
    .moonpay-section,
    .topper-section {
      scroll-margin-top: 24px;
    }
    .topper-section {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #e7e7e7;
      text-align: left;
    }
    .topper-section h2 {
      margin: 0 0 14px;
      color: #333;
      font-size: 1.25em;
      text-align: center;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: bold;
    }
    .field input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      font: inherit;
    }
    .topper-button {
      background-color: #0f8f68;
    }
    .topper-button:hover {
      background-color: #0b7556;
    }
    .topper-button:disabled {
      background-color: #8ab8a9;
      cursor: wait;
    }
    @media (max-width: 520px) {
      body {
        padding: 16px 12px;
      }
      .container {
        padding: 72px 16px 24px;
      }
      .buy-button {
        width: 100%;
      }
    }
    .topper-message {
      min-height: 20px;
      margin: 12px 0 0;
      color: #555;
      font-size: 0.95em;
      text-align: center;
    }
    .topper-message.error {
      color: #b00020;
    }
    .footer-text {
      margin-top: 25px;
      font-size: 0.9em;
      color: #666;
    }
    body { background: #071426; color: #e4edfc; padding: 24px 14px; }
    .container { background: #0c1b2f; border: 1px solid #1d3654; box-shadow: none; box-sizing: border-box; padding: 24px; max-width: 680px; }
    h1, .topper-section h2 { color: #e4edfc; }
    .language-control { position: static; margin: 16px 0; }
    .language-control select { background: #132b47; color: #e4edfc; border-color: #355778; min-height: 44px; max-width: 100%; }
    .language-control select:hover { background: #1a3657; }
    .buy-button:disabled { background: #243a53; color: #b5c4d8; cursor: not-allowed; opacity: 1; max-width: 100%; white-space: normal; }
    .topper-section { border-color: #1d3654; }
    .provider-notice { color: #ffe0a3; background: #342a18; border: 1px solid #85632d; padding: 14px; border-radius: 8px; line-height: 1.5; }
    .footer-text { color: #aebed3; }
    .back-home { color: #9fc3f4; display: inline-flex; align-items: center; min-height: 44px; }
    a:focus-visible, select:focus-visible { outline: 2px solid #9fc3f4; outline-offset: 3px; }
    @media (max-width: 480px) { .container { padding: 18px; } }
  </style>
</head>
<body>

    <h1 id="title">Buy Bitcoin</h1>

    <div class="language-control">
      <select id="language-select" aria-label="Language">
        <option value="en">English</option>
        <option value="ru">Русский</option>
        <option value="he">עברית</option>
        <option value="de">Deutsch</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="zh">中文</option>
      </select>
    </div>

    <div id="moonpay" class="moonpay-section">
      <button id="buy-btn" class="buy-button" disabled aria-describedby="provider-notice">Buy Bitcoin with MoonPay 🚀</button>
    </div>

    <div id="topper" class="topper-section">
      <h2 id="topper-title">Buy Bitcoin with Topper</h2>

      <button id="topper-btn" class="buy-button topper-button" disabled aria-describedby="provider-notice">Buy Bitcoin with Topper ✨</button>
      <p id="topper-message" class="topper-message" role="status" aria-live="polite"></p>
    </div>

    <p class="footer-text" id="footer-text">Powered by MoonPay and Topper</p>
  </div>

    const availability = {

      ru: {soon: 'Скоро', message: 'Покупки пока недоступны. На этой странице платежи не проводятся.', home: 'Вернуться к BTC2G', footer: 'Доступность провайдера зависит от страны.'},

    };

    function setLang(lang) {
      localStorage.setItem('lang', lang);
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
      document.getElementById('language-select').value = lang;
      document.getElementById('language-select').setAttribute('aria-label', texts[lang].languageLabel);
      document.getElementById('language-select').title = texts[lang].languageLabel;
      document.getElementById('title').textContent = texts[lang].title;
      document.getElementById('buy-btn').textContent = texts[lang].buyBtn;
      document.getElementById('topper-title').textContent = texts[lang].topperTitle;
      document.getElementById('topper-btn').textContent = texts[lang].topperBtn;
      const notice = availability[lang] || availability.en;
      document.getElementById('provider-notice').textContent = notice.message;
      document.getElementById('buy-btn').textContent = `MoonPay — ${notice.soon}`;
      document.getElementById('topper-btn').textContent = `Topper — ${notice.soon}`;
      document.getElementById('back-home').textContent = notice.home;
      document.getElementById('footer-text').textContent = notice.footer;
    }

    window.setLang = setLang;
    document.getElementById('language-select').addEventListener('change', (event) => {
      setLang(event.target.value);
    });

    const savedLang = localStorage.getItem('lang');
    const browserLang = navigator.language.slice(0, 2).toLowerCase();
    const supportedLangs = Object.keys(texts);

    if (savedLang && supportedLangs.includes(savedLang)) {
      setLang(savedLang);
    } else if (supportedLangs.includes(browserLang)) {
      setLang(browserLang);
    } else {
      setLang('en');
    }

    // Checkout stays unavailable until a production integration is configured and reviewed.
