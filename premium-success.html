<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTC2G Payment Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      box-sizing: border-box;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom right, #1e1e1e, #2c2c2c);
      color: #ffffff;
      font-family: 'Roboto', sans-serif;
      text-align: center;
    }

    main {
      width: min(560px, 100%);
      box-sizing: border-box;
      padding: 28px;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      background: #1b1b1b;
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.42);
    }

    h1 {
      margin: 0 0 14px;
      font-size: 2em;
    }

    p {
      margin: 0 0 14px;
      color: #dddddd;
      line-height: 1.6;
    }

    .disclaimer {
      color: #bbbbbb;
      font-size: 0.94em;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 12px 22px;
      border-radius: 6px;
      background: #f2a900;
      color: #181818;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover {
      background: #d99600;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      main {
        padding: 22px 16px;
      }

      a {
        width: 100%;
      }
    }
    #status-language { max-width:100%; min-height:44px; padding:8px; font:inherit; background:#132b47; color:#fff; }
  </style>
</head>
<body>
  <main>
    <select id="status-language" aria-label="Language"></select>
    <h1 data-status="title">Payment confirmation pending</h1>
    <p data-status="pending">Opening this page does not confirm payment or activate access. Access requires verified server-side payment confirmation.</p>
    <p class="disclaimer" data-status="disclaimer">BTC2G signals are model-based and not financial advice.</p>
    <a data-status="home" href="index.html">Back to BTC2G</a>
  </main>
  <script src="assets/js/languages.js?v=20261030-7"></script>
  <script src="assets/js/ui-text.js?v=20261030-7"></script>
  <script src="assets/js/payment-status-locales.js?v=20261030-7"></script>
  <script src="assets/js/traffic.js" defer></script>
</body>
</html>
